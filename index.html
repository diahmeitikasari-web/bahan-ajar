<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sosiologi | Semester Genap 2025/2026 - IAIN SAS Babel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                            950: '#052e16',
                        },
                        gold: {
                            400: '#facc15',
                            500: '#eab308',
                            600: '#ca8a04'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        cinematic: ['Cinzel', 'serif']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cinzel:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(34, 197, 94, 0.4);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(34, 197, 94, 0.7);
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen selection:bg-brand-500 selection:text-white">

    <div id="app" class="flex h-screen overflow-hidden">
        
        <!-- Mobile Sidebar Overlay -->
        <div id="sidebar-overlay" class="fixed inset-0 bg-black/70 z-40 hidden md:hidden transition-opacity backdrop-blur-sm" onclick="toggleSidebar()"></div>

        <!-- Sidebar -->
        <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-50 w-72 lg:w-80 glass-panel border-r border-slate-800 flex flex-col transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out">
            <!-- Header Brand -->
            <div class="p-5 border-b border-slate-800/80 flex items-center justify-between bg-slate-900/40">
                <div class="flex items-center space-x-3">
                <img src="bahan-ajar/img/logo-iain.png" alt="Logo IAIN SAS Babel" class="w-10 h-10 object-contain drop-shadow-md">
                <div>
                    <h1 class="font-cinzel font-bold text-base text-slate-100 tracking-wide">SOSIOLOGI</h1>
                    <p class="text-xs text-brand-400 font-medium">Semester Genap 2025/2026</p>
                </div>
            </div>
                <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-white p-2">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Lecturer Info Badge -->
            <div class="px-5 py-3.5 bg-slate-900/60 border-b border-slate-800/60 flex items-center space-x-3">
                <div class="w-9 h-9 rounded-full bg-slate-800 border border-brand-500/40 flex items-center justify-center text-brand-400 font-bold text-sm">
                    DM
                </div>
                <div class="overflow-hidden">
                    <p class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Dosen Pengampu</p>
                    <p class="text-sm font-semibold text-slate-200 truncate">Diah Meitikasari, M.Si.</p>
                    <p class="text-[11px] text-slate-400">IAIN SAS Bangka Belitung</p>
                </div>
            </div>

            <!-- Navigation Links -->
            <div class="flex-1 overflow-y-auto py-4 px-3 space-y-1.5" id="nav-container">
                <!-- Injected via JavaScript -->
            </div>

            <!-- Sidebar Footer / Quick Tools -->
            <div class="p-4 border-t border-slate-800/80 bg-slate-900/40 text-xs text-slate-400 flex items-center justify-between">
                <span><i class="fa-solid fa-shield-halved text-brand-400 mr-1.5"></i> Modul digital</span>
                <button onclick="triggerSearchModal()" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition flex items-center space-x-1">
                    <i class="fa-solid fa-magnifying-glass text-[10px]"></i>
                    <span>Cari</span>
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col h-screen overflow-hidden bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black">
            
            <!-- Top Navigation Bar -->
            <header class="h-16 glass-panel border-b border-slate-800 flex items-center justify-between px-4 lg:px-8 z-30 shrink-0">
                <div class="flex items-center space-x-4">
                    <button onclick="toggleSidebar()" class="md:hidden text-slate-300 hover:text-white p-2 rounded-lg bg-slate-800/60 transition">
                        <i class="fa-solid fa-bars text-lg"></i>
                    </button>
                    <div class="flex items-center space-x-2">
                        <span id="breadcrumb-category" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-brand-500/10 text-brand-400 border border-brand-500/20 uppercase tracking-widest">Sistem Bahan Ajar</span>
                        <i class="fa-solid fa-chevron-right text-[10px] text-slate-600"></i>
                        <span id="breadcrumb-title" class="text-sm font-medium text-slate-300 truncate max-w-[200px] sm:max-w-md">Rencana Pembelajaran Semester (RPS)</span>
                    </div>
                </div>

                <div class="flex items-center space-x-3">
                    <button onclick="openBookmarksModal()" class="p-2.5 rounded-xl bg-slate-900/80 border border-slate-800 text-slate-300 hover:text-brand-400 hover:border-brand-500/40 transition relative group" title="Materi Tersimpan">
                        <i class="fa-solid fa-bookmark"></i>
                        <span id="bookmark-count" class="absolute -top-1 -right-1 w-5 h-5 bg-brand-500 text-slate-950 text-[10px] font-bold rounded-full flex items-center justify-center hidden">0</span>
                    </button>
                    <a href="https://drive.google.com/file/d/1Vdd_jvUuxWERXeClqa3vhYSFcZAPb909/view?usp=drive_link" target="_blank" rel="noopener noreferrer" class="hidden sm:flex items-center space-x-2 px-3.5 py-2 rounded-xl bg-gradient-to-r from-brand-600 to-emerald-600 text-white font-medium text-sm shadow-lg shadow-brand-600/20 hover:from-brand-500 hover:to-emerald-500 transition">
                        <i class="fa-solid fa-file-pdf"></i>
                        <span>Unduh RPS PDF</span>
                    </a>
                    <button onclick="openQuizModal()" class="hidden sm:flex items-center space-x-2 px-3.5 py-2 rounded-xl bg-gradient-to-r from-brand-600 to-emerald-600 text-white font-medium text-sm shadow-lg shadow-brand-600/20 hover:from-brand-500 hover:to-emerald-500 transition">
                        <i class="fa-solid fa-brain"></i>
                        <span>Uji Pemahaman</span>
                    </button>
                </div>
            </header>

            <!-- Dynamic Content Viewport -->
            <div id="main-viewport" class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-10 relative">
                <!-- Dynamically rendered content goes here -->
            </div>
        </main>
    </div>

    <!-- Search Modal -->
    <div id="search-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-start justify-center pt-20 px-4 hidden">
        <div class="glass-panel w-full max-w-2xl rounded-2xl border border-slate-700/80 shadow-2xl overflow-hidden animate-fade-in">
            <div class="p-4 border-b border-slate-800 flex items-center space-x-3">
                <i class="fa-solid fa-magnifying-glass text-brand-400 text-lg"></i>
                <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="Cari topik, konsep, tokoh, atau bab materi..." class="w-full bg-transparent text-slate-100 placeholder-slate-500 focus:outline-none text-base">
                <button onclick="closeSearchModal()" class="text-slate-400 hover:text-white px-2 py-1 rounded bg-slate-800 text-xs">ESC</button>
            </div>
            <div id="search-results" class="max-h-96 overflow-y-auto p-3 space-y-2">
                <div class="text-center py-8 text-slate-500 text-sm">Ketik kata kunci untuk mencari di seluruh materi kuliah sosiologi...</div>
            </div>
        </div>
    </div>

    <!-- Quiz Modal -->
    <div id="quiz-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-panel w-full max-w-xl rounded-2xl border border-slate-700/80 shadow-2xl p-6 relative animate-fade-in">
            <button onclick="closeQuizModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            <div id="quiz-content">
                <!-- Injected via JavaScript -->
            </div>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        const courseData = {
            lecturer: "Diah Meitikasari, M.Si.",
            university: "IAIN SAS Bangka Belitung",
            faculty: "Fakultas Dakwah dan Komunikasi Islam",
            studyProgram: "Program Studi Psikologi Islam",
            semester: "Genap 2025/2026",
            code: "PSI088",
            sks: "2 SKS",
            
            navItems: [
                { id: 'rps', title: 'Rencana Pembelajaran (RPS)', icon: 'fa-file-lines', type: 'rps' },
                { id: 'materi-1', title: '1. Pengantar Sosiologi', subtitle: 'Keanekaragaman & Relasi Psikologi', icon: 'fa-book-open', type: 'material', index: 1 },
                { id: 'materi-2', title: '2. Solidaritas: Emile Durkheim', subtitle: 'Solidaritas Mekanik & Organik', icon: 'fa-users', type: 'material', index: 2 },
                { id: 'materi-3', title: '3. Kelas: Karl Marx', subtitle: 'Borjuis, Proletar & Konflik Sosial', icon: 'fa-scale-balanced', type: 'material', index: 3 },
                { id: 'materi-4', title: '4. Makna: Max Weber', subtitle: 'Tindakan Sosial & Birokrasi', icon: 'fa-lightbulb', type: 'material', index: 4 },
                { id: 'materi-5', title: '5. Interaksi: Georg Simmel', subtitle: 'Mikrointeraksi & Bentuk Sosial', icon: 'fa-network-wired', type: 'material', index: 5 },
                { id: 'materi-6', title: '6. Sistem: Talcott Parsons', subtitle: 'Fungsionalisme Struktural & AGIL', icon: 'fa-cubes', type: 'material', index: 6 },
                { id: 'materi-7', title: '7. Etika: Zygmunt Bauman', subtitle: 'Postmodernitas & Masyarakat Cair', icon: 'fa-compass', type: 'material', index: 7 },
                { id: 'materi-8', title: '8. Arena: Pierre Bourdieu', subtitle: 'Modal, Habitus & Arena Sosial', icon: 'fa-chess', type: 'material', index: 8 },
                { id: 'materi-9', title: '9. Kekuasaan: Michel Foucault', subtitle: 'Relasi Kuasa, Pengetahuan & Disiplin', icon: 'fa-eye', type: 'material', index: 9 },
                { id: 'materi-10', title: '10. Kolonial: Edward Said', subtitle: 'Orientalisme & Wacana Pascakolonial', icon: 'fa-globe', type: 'material', index: 10 }
            ]
        };

        const rpsSubTabs = [
            { id: 'identitas', title: 'Identitas & Otorisasi', icon: 'fa-id-card' },
            { id: 'cpmk', title: 'Capaian Pembelajaran (CPMK)', icon: 'fa-bullseye' },
            { id: 'deskripsi', title: 'Deskripsi & Bahan Kajian', icon: 'fa-book' },
            { id: 'pustaka', title: 'Referensi & Pustaka', icon: 'fa-bookmark' },
            { id: 'evaluasi', title: 'Portofolio & Penilaian', icon: 'fa-chart-pie' }
        ];

        let currentActiveId = 'rps';
        let currentRpsTab = 'identitas';
        let materialTabs = {}; // stores active sub-tab for each material
        let bookmarks = JSON.parse(localStorage.getItem('sosiologi_bookmarks') || '[]');

        document.addEventListener('DOMContentLoaded', () => {
            renderSidebar();
            navigateTo('rps');
            updateBookmarkBadge();
        });

        function renderSidebar() {
            const container = document.getElementById('nav-container');
            container.innerHTML = courseData.navItems.map(item => {
                const isActive = currentActiveId === item.id;
                return `
                    <button onclick="navigateTo('${item.id}')" class="w-full flex items-center space-x-3 px-3.5 py-3 rounded-xl transition font-medium text-sm group ${isActive ? 'bg-brand-500/15 text-brand-400 border border-brand-500/30 shadow-lg shadow-brand-500/5' : 'text-slate-300 hover:bg-slate-800/60 hover:text-white'}">
                        <div class="w-8 h-8 rounded-lg ${isActive ? 'bg-brand-500 text-slate-950' : 'bg-slate-800 text-slate-400 group-hover:text-slate-200'} flex items-center justify-center transition shrink-0">
                            <i class="fa-solid ${item.icon} text-sm"></i>
                        </div>
                        <div class="text-left truncate">
                            <p class="truncate leading-tight">${item.title}</p>
                            ${item.subtitle ? `<p class="text-[11px] text-slate-500 truncate mt-0.5">${item.subtitle}</p>` : ''}
                        </div>
                    </button>
                `;
            }).join('');
        }

        function navigateTo(id) {
            currentActiveId = id;
            renderSidebar();
            
            // Close mobile sidebar if open
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (sidebar && !sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }

            const item = courseData.navItems.find(i => i.id === id);
            if (!item) return;

            document.getElementById('breadcrumb-category').innerText = item.type === 'rps' ? 'Dokumen Kurikulum' : `Materi Kuliah ${item.index}`;
            document.getElementById('breadcrumb-title').innerText = item.title;

            const viewport = document.getElementById('main-viewport');
            viewport.scrollTop = 0;

            if (item.type === 'rps') {
                renderRpsView(viewport);
            } else {
                renderMaterialView(viewport, item.index);
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        function renderRpsView(container) {
            container.innerHTML = `
                <div class="max-w-5xl mx-auto space-y-6 animate-fade-in pb-16">
                    <!-- Banner Header -->
                    <div class="glass-panel p-6 sm:p-8 rounded-3xl border border-slate-700/60 relative overflow-hidden bg-gradient-to-r from-slate-900/90 via-slate-900/60 to-brand-950/30 shadow-xl">
                        <div class="absolute -right-10 -bottom-10 w-64 h-64 bg-brand-500/10 rounded-full blur-3xl pointer-events-none"></div>
                        <div class="relative z-10 flex flex-col md:flex-row md:items-center justify-between gap-6">
                            <div>
                                <span class="px-3 py-1 rounded-full bg-brand-500/20 text-brand-400 text-xs font-semibold tracking-wider uppercase border border-brand-500/30">Rencana Pembelajaran Semester</span>
                                <h2 class="text-2xl sm:text-3xl font-cinzel font-bold text-white mt-2">Mata Kuliah: Sosiologi (${courseData.code})</h2>
                                <p class="text-slate-400 text-sm mt-1">Bobot: ${courseData.sks} | Semester: ${courseData.semester} | Prodi Psikologi Islam</p>
                            </div>
                            <div class="flex items-center space-x-3 shrink-0">
                                <button onclick="toggleBookmark('rps-doc')" class="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-sm font-medium transition flex items-center space-x-2">
                                    <i class="fa-solid fa-bookmark ${isBookmarked('rps-doc') ? 'text-brand-400' : ''}"></i>
                                    <span>${isBookmarked('rps-doc') ? 'Disimpan' : 'Simpan RPS'}</span>
                                </button>
                                <button onclick="window.print()" class="px-4 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-500 text-white text-sm font-medium transition flex items-center space-x-2 shadow-lg shadow-brand-600/20">
                                    <i class="fa-solid fa-print"></i>
                                    <span>Cetak PDF</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- RPS Sub-navigation Tabs -->
                    <div class="flex overflow-x-auto pb-2 gap-2 scrollbar-none">
                        ${rpsSubTabs.map(tab => `
                            <button onclick="switchRpsTab('${tab.id}')" class="px-4 py-2.5 rounded-xl text-sm font-medium transition shrink-0 flex items-center space-x-2 ${currentRpsTab === tab.id ? 'bg-brand-500 text-slate-950 font-semibold shadow-lg shadow-brand-500/20' : 'glass-panel text-slate-300 hover:bg-slate-800/80'}">
                                <i class="fa-solid ${tab.icon}"></i>
                                <span>${tab.title}</span>
                            </button>
                        `).join('')}
                    </div>

                    <!-- RPS Tab Content Area -->
                    <div id="rps-tab-content" class="glass-panel p-6 sm:p-8 rounded-3xl border border-slate-800/80 shadow-2xl">
                        <!-- Content rendered dynamically -->
                    </div>
                </div>
            `;
            renderRpsTabContent();
        }

        function switchRpsTab(tabId) {
            currentRpsTab = tabId;
            renderRpsView(document.getElementById('main-viewport'));
        }

        function renderRpsTabContent() {
            const contentContainer = document.getElementById('rps-tab-content');
            if (!contentContainer) return;

            switch(currentRpsTab) {
                case 'identitas':
                    contentContainer.innerHTML = `
                        <div class="space-y-6 animate-fade-in">
                            <h3 class="text-xl font-cinzel font-bold text-white flex items-center space-x-3 border-b border-slate-800 pb-4">
                                <i class="fa-solid fa-id-card text-brand-400"></i>
                                <span>Identitas Mata Kuliah & Otorisasi</span>
                            </h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div class="bg-slate-900/60 p-5 rounded-2xl border border-slate-800">
                                    <h4 class="text-xs font-semibold uppercase text-brand-400 tracking-wider">Informasi Akademik</h4>
                                    <ul class="mt-4 space-y-3 text-sm">
                                        <li class="flex justify-between border-b border-slate-800/60 pb-2"><span class="text-slate-400">Perguruan Tinggi</span> <span class="font-medium text-slate-200">IAIN SAS Bangka Belitung</span></li>
                                        <li class="flex justify-between border-b border-slate-800/60 pb-2"><span class="text-slate-400">Fakultas</span> <span class="font-medium text-slate-200">Dakwah & Komunikasi Islam</span></li>
                                        <li class="flex justify-between border-b border-slate-800/60 pb-2"><span class="text-slate-400">Program Studi</span> <span class="font-medium text-slate-200">Psikologi Islam</span></li>
                                        <li class="flex justify-between border-b border-slate-800/60 pb-2"><span class="text-slate-400">Mata Kuliah / Kode</span> <span class="font-medium text-slate-200">Sosiologi (${courseData.code})</span></li>
                                        <li class="flex justify-between border-b border-slate-800/60 pb-2"><span class="text-slate-400">Bobot SKS</span> <span class="font-medium text-slate-200">2 SKS (T=2, P=0)</span></li>
                                        <li class="flex justify-between pb-2"><span class="text-slate-400">Semester</span> <span class="font-medium text-slate-200">2 (Genap 2025/2026)</span></li>
                                    </ul>
                                </div>
                                <div class="bg-slate-900/60 p-5 rounded-2xl border border-slate-800">
                                    <h4 class="text-xs font-semibold uppercase text-brand-400 tracking-wider">Tim Pengampu & Otorisasi</h4>
                                    <ul class="mt-4 space-y-3 text-sm">
                                        <li class="flex justify-between border-b border-slate-800/60 pb-2"><span class="text-slate-400">Dosen Pengampu</span> <span class="font-medium text-slate-200">Diah Meitikasari, M.Si.</span></li>
                                        <li class="flex justify-between border-b border-slate-800/60 pb-2"><span class="text-slate-400">NIP Dosen</span> <span class="font-medium text-slate-200">199005292019032008</span></li>
                                        <li class="flex justify-between border-b border-slate-800/60 pb-2"><span class="text-slate-400">Koordinator RMK</span> <span class="font-medium text-slate-200">Diah Meitikasari, M.Si.</span></li>
                                        <li class="flex justify-between pb-2"><span class="text-slate-400">Ketua Program Studi</span> <span class="font-medium text-slate-200">Oktarizal Drianus, M.Psi.</span></li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    `;
                    break;
                case 'cpmk':
                    contentContainer.innerHTML = `
                        <div class="space-y-6 animate-fade-in">
                            <h3 class="text-xl font-cinzel font-bold text-white flex items-center space-x-3 border-b border-slate-800 pb-4">
                                <i class="fa-solid fa-bullseye text-brand-400"></i>
                                <span>Capaian Pembelajaran Lulusan (CPL) & Mata Kuliah (CPMK)</span>
                            </h3>
                            <div class="space-y-4">
                                <div class="p-4 rounded-xl bg-slate-900/70 border border-slate-800">
                                    <h4 class="text-xs font-bold text-brand-400 uppercase tracking-widest">CPL yang Dibebankan</h4>
                                    <ul class="mt-2 space-y-2 text-sm text-slate-300">
                                        <li><strong class="text-white">CPL1 (S5):</strong> Menghargai keanekaragaman budaya, pandangan, agama, dan kepercayaan, serta pendapat atau temuan orisinal orang lain.</li>
                                        <li><strong class="text-white">CPL2 (P9):</strong> Menguasai konsep teoritis utama (major concepts) tentang proses dan fungsi mental manusia dalam berbagai aspek kehidupan.</li>
                                        <li><strong class="text-white">CPL3 (KU2):</strong> Mampu mengkaji implikasi pengembangan atau implementasi ilmu pengetahuan teknologi yang memperhatikan nilai humaniora.</li>
                                        <li><strong class="text-white">CPL4 (KK24):</strong> Menguasai konsep teoritis mengenai hubungan manusia dan lingkungan sosial.</li>
                                    </ul>
                                </div>
                                <div class="p-4 rounded-xl bg-slate-900/70 border border-slate-800">
                                    <h4 class="text-xs font-bold text-brand-400 uppercase tracking-widest">Capaian Pembelajaran Mata Kuliah (CPMK)</h4>
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-3">
                                        <div class="p-3 rounded-lg bg-slate-800/50 border border-slate-700/50 text-sm">
                                            <span class="font-bold text-brand-400">CPMK1:</span> Menghargai nilai-nilai keanekaragaman dalam budaya, pandangan, agama, dan kepercayaan.
                                        </div>
                                        <div class="p-3 rounded-lg bg-slate-800/50 border border-slate-700/50 text-sm">

        function renderMaterialView(container, materialIndex) {
            const data = materialContentDB[materialIndex];
            if (!data) return;

            // Initialize active tab for this material if not set
            if (!materialTabs[materialIndex]) {
                materialTabs[materialIndex] = data.tabs[0].id;
            }
            const activeTabId = materialTabs[materialIndex];

            container.innerHTML = `
                <div class="max-w-5xl mx-auto space-y-6 animate-fade-in pb-16">
                    <!-- Material Header -->
                    <div class="glass-panel p-6 sm:p-8 rounded-3xl border border-slate-700/60 relative overflow-hidden bg-gradient-to-r from-slate-900/90 via-slate-900/60 to-brand-950/30 shadow-xl">
                        <div class="absolute -right-10 -bottom-10 w-64 h-64 bg-brand-500/10 rounded-full blur-3xl pointer-events-none"></div>
                        <div class="relative z-10 flex flex-col md:flex-row md:items-center justify-between gap-6">
                            <div>
                                <span class="px-3 py-1 rounded-full bg-brand-500/20 text-brand-400 text-xs font-semibold tracking-wider uppercase border border-brand-500/30">Materi Kuliah ${materialIndex} dari 10</span>
                                <h2 class="text-2xl sm:text-3xl font-cinzel font-bold text-white mt-2">${data.title}</h2>
                                <p class="text-slate-400 text-sm mt-1">${data.subtitle}</p>
                            </div>
                            <div class="flex items-center space-x-3 shrink-0">
                                <button onclick="toggleBookmark('materi-${materialIndex}')" class="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-sm font-medium transition flex items-center space-x-2">
                                    <i class="fa-solid fa-bookmark ${isBookmarked(`materi-${materialIndex}`) ? 'text-brand-400' : ''}"></i>
                                    <span>${isBookmarked(`materi-${materialIndex}`) ? 'Tersimpan' : 'Simpan Materi'}</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Material Navigation Tabs -->
                    <div class="flex overflow-x-auto pb-2 gap-2 scrollbar-none">
                        ${data.tabs.map(tab => `
                            <button onclick="switchMaterialTab(${materialIndex}, '${tab.id}')" class="px-4 py-2.5 rounded-xl text-sm font-medium transition shrink-0 flex items-center space-x-2 ${activeTabId === tab.id ? 'bg-brand-500 text-slate-950 font-semibold shadow-lg shadow-brand-500/20' : 'glass-panel text-slate-300 hover:bg-slate-800/80'}">
                                <i class="fa-solid ${tab.icon}"></i>
                                <span>${tab.title}</span>
                            </button>
                        `).join('')}
                    </div>

                    <!-- Material Tab Content -->
                    <div class="glass-panel p-6 sm:p-8 rounded-3xl border border-slate-800/80 shadow-2xl">
                        <div class="animate-fade-in">
                            ${data.content[activeTabId]}
                        </div>
                    </div>

                    <!-- Pagination Footer -->
                    <div class="flex items-center justify-between pt-4">
                        ${materialIndex > 1 ? `<button onclick="navigateTo('materi-${materialIndex - 1}')" class="px-4 py-2.5 rounded-xl glass-panel hover:bg-slate-800 text-slate-300 text-sm font-medium transition flex items-center space-x-2"><i class="fa-solid fa-arrow-left"></i><span>Materi Sebelumnya</span></button>` : '<div></div>'}
                        ${materialIndex < 10 ? `<button onclick="navigateTo('materi-${materialIndex + 1}')" class="px-4 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-500 text-white text-sm font-medium transition flex items-center space-x-2 shadow-lg shadow-brand-600/20"><span>Materi Selanjutnya</span><i class="fa-solid fa-arrow-right"></i></button>` : '<div></div>'}
                    </div>
                </div>
            `;
        }

        function switchMaterialTab(materialIndex, tabId) {
            materialTabs[materialIndex] = tabId;
            renderMaterialView(document.getElementById('main-viewport'), materialIndex);
        }

        function toggleBookmark(id) {
            if (bookmarks.includes(id)) {
                bookmarks = bookmarks.filter(b => b !== id);
            } else {
                bookmarks.push(id);
            }
            localStorage.setItem('sosiologi_bookmarks', JSON.stringify(bookmarks));
            updateBookmarkBadge();
            // Re-render current view to update bookmark button state
            navigateTo(currentActiveId);
        }

        function isBookmarked(id) {
            return bookmarks.includes(id);
        }

        function updateBookmarkBadge() {
            const badge = document.getElementById('bookmark-count');
            if (bookmarks.length > 0) {
                badge.innerText = bookmarks.length;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function openBookmarksModal() {
            const modal = document.getElementById('search-modal');
            const input = document.getElementById('search-input');
            const results = document.getElementById('search-results');
            
            input.value = '';
            modal.classList.remove('hidden');
            
            if (bookmarks.length === 0) {
                results.innerHTML = `<div class="text-center py-8 text-slate-500 text-sm">Belum ada materi yang disimpan ke bookmark.</div>`;
                return;
            }

            results.innerHTML = `
                <div class="text-xs font-bold text-brand-400 uppercase tracking-wider px-3 py-1">Materi Tersimpan (${bookmarks.length})</div>
                ${bookmarks.map(id => {
                    const item = courseData.navItems.find(i => i.id === id) || { title: 'Rencana Pembelajaran Semester', id: 'rps' };
                    return `
                        <div onclick="navigateTo('${item.id}'); closeSearchModal();" class="p-3 rounded-xl bg-slate-900/60 hover:bg-slate-800 border border-slate-800/80 cursor-pointer transition flex items-center justify-between">
                            <div class="flex items-center space-x-3">
                                <i class="fa-solid fa-bookmark text-brand-400"></i>
                                <span class="text-sm font-medium text-slate-200">${item.title}</span>
                            </div>
                            <i class="fa-solid fa-chevron-right text-xs text-slate-500"></i>
                        </div>
                    `;
                }).join('')}
            `;
        }

        function triggerSearchModal() {
            document.getElementById('search-modal').classList.remove('hidden');
            document.getElementById('search-input').focus();
        }

        function closeSearchModal() {
            document.getElementById('search-modal').classList.add('hidden');
        }

        function handleSearch(query) {
            const resultsContainer = document.getElementById('search-results');
            if (!query.trim()) {
                resultsContainer.innerHTML = `<div class="text-center py-8 text-slate-500 text-sm">Ketik kata kunci untuk mencari di seluruh materi kuliah sosiologi...</div>`;
                return;
            }

            const q = query.toLowerCase();
            const matches = [];

            courseData.navItems.forEach(item => {
                if (item.title.toLowerCase().includes(q) || (item.subtitle && item.subtitle.toLowerCase().includes(q))) {
                    matches.push(item);
                }
            });

            if (matches.length === 0) {
                resultsContainer.innerHTML = `<div class="text-center py-8 text-slate-500 text-sm">Tidak ditemukan materi dengan kata kunci "${query}"</div>`;
                return;
            }

            resultsContainer.innerHTML = `
                <div class="text-xs font-bold text-brand-400 uppercase tracking-wider px-3 py-1">Hasil Pencarian (${matches.length})</div>
                ${matches.map(item => `
                    <div onclick="navigateTo('${item.id}'); closeSearchModal();" class="p-3 rounded-xl bg-slate-900/60 hover:bg-slate-800 border border-slate-800/80 cursor-pointer transition flex items-center justify-between">
                        <div>
                            <p class="text-sm font-medium text-slate-200">${item.title}</p>
                            ${item.subtitle ? `<p class="text-xs text-slate-400">${item.subtitle}</p>` : ''}
                        </div>
                        <i class="fa-solid fa-arrow-right text-xs text-slate-500"></i>
                    </div>
                `).join('')}
            `;
        }

        const quizData = {
            1: { q: "Siapa tokoh yang mencetuskan istilah Sosiologi pertama kali pada tahun 1842?", opts: ["Karl Marx", "Auguste Comte", "Emile Durkheim", "Max Weber"], ans: 1 },
            2: { q: "Solidaritas yang didasarkan pada kesamaan kolektif dalam masyarakat tradisional disebut...", opts: ["Solidaritas Organik", "Solidaritas Mekanik", "Solidaritas Fungsional", "Solidaritas Modern"], ans: 1 },
            3: { q: "Dalam teori Karl Marx, kaum pemilik modal dan alat produksi disebut sebagai...", opts: ["Proletar", "Borjuis", "Birokrat", "Subaltern"], ans: 1 },
            4: { q: "Tindakan sosial yang dilakukan semata-mata karena kebiasaan turun-temurun disebut...", opts: ["Tujuan-Rasional", "Afektif", "Tradisional", "Nilai-Rasional"], ans: 2 },
            5: { q: "Simmel menyebut kelompok sosial yang terdiri dari 2 orang sebagai...", opts: ["Dyad", "Triad", "Guild", "Clan"], ans: 0 },
            6: { q: "Dalam skema AGIL Talcott Parsons, huruf 'A' merepresentasikan...", opts: ["Adaptation", "Action", "Authority", "Aggregation"], ans: 0 },
            7: { q: "Zygmunt Bauman menggambarkan era saat ini dengan istilah...", opts: ["Solid Modernity", "Liquid Modernity", "Rigid Modernity", "Static Modernity"], ans: 1 },
            8: { q: "Modal yang mencakup pengetahuan, keterampilan, dan gelar akademik menurut Bourdieu disebut...", opts: ["Modal Ekonomi", "Modal Sosial", "Modal Budaya", "Modal Simbolik"], ans: 2 },
            9: { q: "Konsep arsitektur penjara yang digunakan Foucault untuk menggambarkan masyarakat pengawasan adalah...", opts: ["Panoptikon", "Babel", "Agora", "Utopia"], ans: 0 },
            10: { q: "Kritik wacana kolonial yang mengonstruksi dunia Timur sebagai 'Yang Liyan' dicetuskan oleh...", opts: ["Edward Said", "Gayatri Spivak", "Michel Foucault", "Zygmunt Bauman"], ans: 0 }
        };

        function triggerQuiz(materialIndex) {
            const quiz = quizData[materialIndex];
            if (!quiz) return;

            const modal = document.getElementById('quiz-modal');
            const content = document.getElementById('quiz-content');

            content.innerHTML = `
                <div class="space-y-5 animate-fade-in">
                    <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                        <span class="text-xs font-bold text-brand-400 uppercase tracking-widest">Uji Pemahaman - Materi ${materialIndex}</span>
                        <span class="text-xs text-slate-400">Pilihan Ganda</span>
                    </div>
                    <p class="text-base font-semibold text-white">${quiz.q}</p>
                    <div class="space-y-2.5">
                        ${quiz.opts.map((opt, i) => `
                            <button onclick="checkQuizAnswer(${materialIndex}, ${i}, ${quiz.ans})" class="w-full text-left p-3.5 rounded-xl bg-slate-900/80 hover:bg-slate-800 border border-slate-800 text-sm text-slate-200 transition quiz-opt-${i}">
                                ${opt}
                            </button>
                        `).join('')}
                    </div>
                    <div id="quiz-feedback" class="text-sm font-medium pt-2"></div>
                </div>
            `;
            modal.classList.remove('hidden');
        }

        function checkQuizAnswer(materialIndex, selected, correct) {
            const feedback = document.getElementById('quiz-feedback');
            const buttons = document.querySelectorAll('#quiz-content button');

            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === correct) {
                    btn.classList.add('bg-emerald-500/20', 'border-emerald-500', 'text-emerald-300');
                } else if (idx === selected && selected !== correct) {
                    btn.classList.add('bg-rose-500/20', 'border-rose-500', 'text-rose-300');
                }
            });

            if (selected === correct) {
                feedback.innerHTML = `<p class="text-emerald-400"><i class="fa-solid fa-circle-check mr-2"></i>Jawaban Anda Benar! Pemahaman materi sangat baik.</p>`;
            } else {
                feedback.innerHTML = `<p class="text-rose-400"><i class="fa-solid fa-circle-xmark mr-2"></i>Jawaban Kurang Tepat. Silakan tinjau kembali ringkasan materi.</p>`;
            }
        }

        function openQuizModal() {
            triggerQuiz(1);
        }

        function closeQuizModal() {
            document.getElementById('quiz-modal').classList.add('hidden');
        }
    </script>
</body>
</html>
